# QuoteFlow 的 nginx 站点（只用 HTTP，仅限内网试用）：托管前端静态文件，/api 反代到本机的 quoteflow-api。
# 复制到 /etc/nginx/conf.d/quoteflow.conf，然后 nginx -t && systemctl reload nginx。
# 同时把 /etc/quoteflow/quoteflow.env 的 COOKIE_SECURE 改成 false、APP_BASE_URL 改成 http:// 地址并重启 quoteflow-api，
# 否则浏览器不回传会话 cookie、无法登录。正式环境用 nginx-quoteflow-https.conf。

upstream quoteflow_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    # 用 IP 或内网域名访问都可以
    server_name _;

    root /opt/quoteflow/current/web;

    # 规格书 50MB、上传上限 + 表单开销
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://quoteflow_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 导出、导入较大的 Excel
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vite 构建产物文件名带内容哈希，可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 前端路由：其他路径都回到 index.html（不缓存，升级后立即生效）
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
