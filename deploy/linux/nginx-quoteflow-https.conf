# QuoteFlow 的 nginx 站点（HTTPS，正式环境用）：托管前端静态文件，/api 反代到本机的 quoteflow-api。
# 复制到 /etc/nginx/conf.d/quoteflow.conf，把 quote.example.com 换成实际域名、填好证书路径，然后
#   nginx -t && systemctl reload nginx
# 只在内网用 HTTP 试用时改用 nginx-quoteflow-http.conf（docs/交付/部署手册-不使用Docker.md §6.4）。

upstream quoteflow_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP 一律跳转到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name quote.example.com;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.25.1 起可以改写成 listen 443 ssl; 加一行 http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quote.example.com;

    ssl_certificate     /etc/nginx/ssl/quoteflow.crt;
    ssl_certificate_key /etc/nginx/ssl/quoteflow.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:quoteflow_ssl:10m;
    ssl_session_timeout 1d;

    root /opt/quoteflow/current/web;

    # 规格书 50MB、上传上限 + 表单开销
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://quoteflow_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 导出、导入较大的 Excel
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vite 构建产物文件名带内容哈希，可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 前端路由：其他路径都回到 index.html（不缓存，升级后立即生效）
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
