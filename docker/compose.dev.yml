# QuoteFlow 开发依赖：PostgreSQL + Mailpit，跑在本机 Docker，Node 应用直接在本机运行。
#
#   启动：docker compose -f docker/compose.dev.yml up -d
#   状态：docker compose -f docker/compose.dev.yml ps
#   停止：docker compose -f docker/compose.dev.yml stop      （保留数据）
#
# 端口只绑定 127.0.0.1，不对局域网开放：
#   15432 → PostgreSQL（库/用户 quoteflow，密码 quoteflow_dev）
#   11025 → Mailpit SMTP
#   18025 → Mailpit Web UI
# 仅供开发：账号密码是固定的弱口令，不要放真实数据。

name: quoteflow-dev

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: quoteflow
      POSTGRES_PASSWORD: quoteflow_dev
      POSTGRES_DB: quoteflow
      TZ: UTC
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quoteflow -d quoteflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"

volumes:
  pgdata:
